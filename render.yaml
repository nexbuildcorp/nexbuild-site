services:
  - type: web
    name: nexbuild-site
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
